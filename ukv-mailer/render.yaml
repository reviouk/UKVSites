# Render Blueprint for ukv-mailer. The service was created via the Render API;
# this file documents the shape so it can be recreated with "New → Blueprint".
services:
  - type: web
    name: ukv-mailer
    runtime: node
    region: frankfurt
    plan: starter            # must NOT be free: the scheduler has to stay awake all day
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: ukv-mailer-db, property: connectionString }
      - key: BASE_URL
        value: https://ukv-mailer.onrender.com
      - key: TRACK_URL_INVESTCHRONICLES
        value: https://go.investchronicles.com
      - key: TRACK_URL_MARKETWATCHER
        value: https://go.marketwatcher.co.uk
      - key: TRACK_STEP1
        value: "false"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
      - key: DAILY_TOTAL
        value: "1000"
      - key: MAILBOX_DAILY_CAP
        value: "40"
      - key: SEND_DAYS
        value: "1,2,3,4,5"
      - key: SEND_WINDOW_START
        value: "08:00"
      - key: SEND_WINDOW_END
        value: "17:30"
      - key: TIMEZONE
        value: Europe/London
      - key: SMTP_HOST
        value: smtp.maildoso.com
      - key: SMTP_PORT
        value: "587"
      - key: IMAP_HOST
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASS
        sync: false
      - key: HUBSPOT_TOKEN
        sync: false

databases:
  - name: ukv-mailer-db
    plan: basic-256mb
    region: frankfurt
